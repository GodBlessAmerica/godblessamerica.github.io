<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="支持中英文的 Base64 文本编码与解码工具">
  <title>Base64 编码 / 解码工具</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #667085;
      --secondary-hover: #4b5563;
      --border: #dce3ee;
      --success: #087a3e;
      --error: #c62828;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e8f1ff 0, transparent 32%),
        var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .container {
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      margin-bottom: 18px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .box {
      padding: 26px;
      background: var(--surface);
      border: 1px solid rgba(220, 227, 238, 0.9);
      border-radius: 18px;
      box-shadow: 0 16px 45px rgba(31, 41, 55, 0.09);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 34px);
      text-align: center;
      letter-spacing: -0.03em;
    }

    .tip {
      margin: 10px 0 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .label {
      display: block;
      margin: 15px 0 8px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 14px;
      color: var(--text);
      background: #fbfcfe;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      resize: vertical;
      font: 15px/1.65 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
      margin: 19px 0;
    }

    button {
      min-height: 44px;
      padding: 11px 18px;
      color: #ffffff;
      background: var(--primary);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 650;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: var(--secondary);
    }

    button.secondary:hover {
      background: var(--secondary-hover);
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      color: var(--success);
      font-size: 14px;
      text-align: center;
    }

    .note {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 12px;
      }

      .box {
        padding: 20px 15px;
      }

      textarea {
        min-height: 145px;
      }

      button {
        flex: 1 1 calc(50% - 11px);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="../">← 返回工具箱</a>

    <section class="box">
      <h1>Base64 编码 / 解码工具</h1>
      <p class="tip">支持中英文，内容仅在当前浏览器中处理。</p>

      <label class="label" for="inputText">输入内容</label>
      <textarea id="inputText" spellcheck="false" placeholder="请输入要编码或解码的文本……"></textarea>

      <div class="buttons">
        <button type="button" id="encodeButton">Base64 编码</button>
        <button type="button" id="decodeButton">Base64 解码</button>
        <button type="button" id="copyButton">复制结果</button>
        <button type="button" class="secondary" id="clearButton">清空</button>
      </div>

      <label class="label" for="outputText">输出结果</label>
      <textarea id="outputText" spellcheck="false" readonly placeholder="结果会显示在这里……"></textarea>

      <div class="message" id="message" role="status" aria-live="polite"></div>
      <p class="note">提示：Base64 是编码方式，并不提供密码学意义上的加密保护。</p>
    </section>
  </main>

  <script>
    const inputText = document.getElementById("inputText");
    const outputText = document.getElementById("outputText");
    const message = document.getElementById("message");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "var(--error)" : "var(--success)";
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;

      for (let index = 0; index < bytes.length; index += chunkSize) {
        const chunk = bytes.subarray(index, index + chunkSize);
        binary += String.fromCharCode(...chunk);
      }

      return btoa(binary);
    }

    function encodeBase64() {
      try {
        const bytes = new TextEncoder().encode(inputText.value);
        outputText.value = bytesToBase64(bytes);
        showMessage("编码成功");
      } catch (error) {
        showMessage(`编码失败：${error.message}`, true);
      }
    }

    function decodeBase64() {
      const input = inputText.value.replace(/\\s/g, "");

      if (!input) {
        showMessage("请输入需要解码的 Base64 内容", true);
        return;
      }

      try {
        const binary = atob(input);
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        outputText.value = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        showMessage("解码成功");
      } catch (error) {
        showMessage("解码失败：输入内容不是有效的 UTF-8 Base64 文本", true);
      }
    }

    async function copyResult() {
      if (!outputText.value) {
        showMessage("没有可复制的内容", true);
        return;
      }

      try {
        await navigator.clipboard.writeText(outputText.value);
        showMessage("结果已复制");
      } catch (error) {
        outputText.removeAttribute("readonly");
        outputText.select();
        const copied = document.execCommand("copy");
        outputText.setAttribute("readonly", "");
        showMessage(copied ? "结果已复制" : "复制失败，请手动复制", !copied);
      }
    }

    function clearAll() {
      inputText.value = "";
      outputText.value = "";
      showMessage("已清空");
      inputText.focus();
    }

    document.getElementById("encodeButton").addEventListener("click", encodeBase64);
    document.getElementById("decodeButton").addEventListener("click", decodeBase64);
    document.getElementById("copyButton").addEventListener("click", copyResult);
    document.getElementById("clearButton").addEventListener("click", clearAll);
  </script>
</body>
</html>
