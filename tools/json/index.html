<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Format, validate, minify, copy, and download JSON locally in your browser">
  <title>JSON Formatter</title>
  <style>
    :root{color-scheme:light;--background:#f4f7fb;--surface:#fff;--text:#172033;--muted:#667085;--primary:#2563eb;--primary-hover:#1d4ed8;--secondary:#667085;--secondary-hover:#4b5563;--border:#dce3ee;--success:#087a3e;--error:#c62828}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px 20px;color:var(--text);background:radial-gradient(circle at top left,#e8f1ff 0,transparent 32%),var(--background);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.container{width:min(100%,1080px);margin:0 auto}.back-link{display:inline-flex;align-items:center;margin-bottom:18px;color:var(--primary);font-weight:600;text-decoration:none}.back-link:hover{text-decoration:underline}.box{padding:26px;background:var(--surface);border:1px solid rgba(220,227,238,.9);border-radius:18px;box-shadow:0 16px 45px rgba(31,41,55,.09)}h1{margin:0;font-size:clamp(26px,5vw,34px);text-align:center;letter-spacing:-.03em}.tip{margin:10px 0 24px;color:var(--muted);text-align:center;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}button,.file-button,select{min-height:42px;border-radius:10px;font:inherit;font-weight:650}button,.file-button{padding:10px 16px;color:#fff;background:var(--primary);border:0;cursor:pointer;transition:background .2s,transform .1s}button:hover,.file-button:hover{background:var(--primary-hover)}button:active,.file-button:active{transform:translateY(1px)}button.secondary,.file-button.secondary{background:var(--secondary)}button.secondary:hover,.file-button.secondary:hover{background:var(--secondary-hover)}select{padding:8px 11px;color:var(--text);background:#fbfcfe;border:1px solid var(--border);outline:none}.editors{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-width:0}.label{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-weight:700}.label small{color:var(--muted);font-weight:500}textarea{width:100%;min-height:430px;padding:14px;color:var(--text);background:#fbfcfe;border:1px solid var(--border);border-radius:11px;outline:none;resize:vertical;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:2;transition:border-color .2s,box-shadow .2s}textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.message{min-height:24px;margin-top:14px;font-size:14px;text-align:center}.note{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}@media(max-width:760px){body{padding:22px 12px}.box{padding:20px 15px}.editors{grid-template-columns:1fr}textarea{min-height:300px}.toolbar>*{flex:1 1 calc(50% - 10px);text-align:center}}
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="../">← Back to toolbox</a>
    <section class="box">
      <h1>JSON Formatter</h1>
      <p class="tip">Format, validate, minify, copy, and download JSON. Everything stays in your browser.</p>
      <div class="toolbar">
        <button type="button" id="format">Format</button>
        <button type="button" id="minify">Minify</button>
        <button type="button" id="validate">Validate</button>
        <button type="button" id="copy">Copy result</button>
        <button type="button" id="download">Download .json</button>
        <label class="file-button secondary" for="file">Open .json</label>
        <input id="file" type="file" accept=".json,application/json" hidden>
        <button type="button" class="secondary" id="clear">Clear</button>
        <select id="indent" aria-label="Indentation"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select>
      </div>
      <div class="editors">
        <div class="panel"><div class="label"><label for="input">Input JSON</label><small id="inputSize">0 characters</small></div><textarea id="input" spellcheck="false" placeholder='Paste JSON here, for example: {"name":"Frank","active":true}'></textarea></div>
        <div class="panel"><div class="label"><label for="output">Result</label><small id="outputSize">0 characters</small></div><textarea id="output" spellcheck="false" readonly placeholder="Formatted or minified JSON will appear here."></textarea></div>
      </div>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <p class="note">Large JSON documents are loaded into memory as a whole. No content is uploaded or stored.</p>
    </section>
  </main>
  <script>
    const input=document.getElementById("input"),output=document.getElementById("output"),message=document.getElementById("message"),indent=document.getElementById("indent"),inputSize=document.getElementById("inputSize"),outputSize=document.getElementById("outputSize");
    function updateCounts(){inputSize.textContent=input.value.length.toLocaleString()+" characters";outputSize.textContent=output.value.length.toLocaleString()+" characters"}
    function setMessage(text,error=false){message.textContent=text;message.style.color=error?"var(--error)":"var(--success)"}
    function parse(){if(!input.value.trim())throw new Error("Input is empty.");return JSON.parse(input.value)}
    function errorLocation(error){const match=String(error.message).match(/position[ ]+([0-9]+)/i);if(!match)return error.message;const pos=Number(match[1]),before=input.value.slice(0,pos),nl=String.fromCharCode(10),line=before.split(nl).length,column=pos-before.lastIndexOf(nl);return error.message+" (line "+line+", column "+column+")"}
    function format(){try{const space=indent.value==="tab"?"	":Number(indent.value);output.value=JSON.stringify(parse(),null,space);setMessage("Valid JSON — formatted successfully.");updateCounts()}catch(e){setMessage(errorLocation(e),true)}}
    function minify(){try{output.value=JSON.stringify(parse());setMessage("Valid JSON — minified successfully.");updateCounts()}catch(e){setMessage(errorLocation(e),true)}}
    function validate(){try{parse();setMessage("Valid JSON.");}catch(e){setMessage(errorLocation(e),true)}}
    async function copy(){if(!output.value){setMessage("There is no result to copy.",true);return}try{await navigator.clipboard.writeText(output.value);setMessage("Result copied.");}catch(e){output.select();document.execCommand("copy");setMessage("Result copied.");}}
    function download(){if(!output.value){setMessage("There is no result to download.",true);return}const blob=new Blob([output.value],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="formatted.json";a.click();URL.revokeObjectURL(url);setMessage("Download started.")}
    function clearAll(){input.value="";output.value="";message.textContent="";updateCounts();input.focus()}
    document.getElementById("format").onclick=format;document.getElementById("minify").onclick=minify;document.getElementById("validate").onclick=validate;document.getElementById("copy").onclick=copy;document.getElementById("download").onclick=download;document.getElementById("clear").onclick=clearAll;
    document.getElementById("file").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{input.value=await file.text();output.value="";updateCounts();validate();}catch(err){setMessage("Could not read the selected file.",true)}e.target.value=""};
    input.addEventListener("input",updateCounts);input.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const start=input.selectionStart,end=input.selectionEnd;input.setRangeText("	",start,end,"end");updateCounts()}});indent.addEventListener("change",()=>{input.style.tabSize=indent.value==="tab"?"4":indent.value;output.style.tabSize=input.style.tabSize});updateCounts();
  </script>
</body>
</html>
