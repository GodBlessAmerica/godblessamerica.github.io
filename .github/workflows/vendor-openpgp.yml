name: Vendor OpenPGP.js

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-openpgp.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned OpenPGP.js 6.3.1
        run: |
          rm -rf .vendor-openpgp
          mkdir -p .vendor-openpgp tools/pgp/lib
          cd .vendor-openpgp
          npm pack openpgp@6.3.1
          tar -xzf openpgp-6.3.1.tgz
          cp package/dist/openpgp.min.mjs ../tools/pgp/lib/openpgp.min.mjs
          cd ..
          rm -rf .vendor-openpgp
      - name: Commit vendored browser bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pgp/lib/openpgp.min.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Vendor OpenPGP.js 6.3.1 browser bundle'
            git push
          fi

# One-shot vendoring workflow. Remove after the bundle is committed.
