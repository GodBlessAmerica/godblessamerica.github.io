name: Publish verified USDT wallet source

on:
  push:
    paths:
      - '.github/workflows/publish-usdt-source.yml'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and verify wallet source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='24be97bcc1c34dd0afbe56153dd851ca2e36a304f01edaf456014c4b74eb7239'
          ZIP='tools/usdt/usdt-wallet-arbitrum-v2.3-offline.zip'
          mkdir -p tools/usdt/source
          TMP="$(mktemp -d)"
          unzip -p "$ZIP" index.html > "$TMP/index.html"
          ACTUAL="$(sha256sum "$TMP/index.html" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          cp "$TMP/index.html" tools/usdt/source/index.html
          printf '%s  index.html\n' "$EXPECTED" > tools/usdt/source/SHA256SUMS.txt

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/usdt/source/index.html tools/usdt/source/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Source already published and unchanged.'
            exit 0
          fi
          git commit -m 'Publish verified USDT wallet source'
          git push
